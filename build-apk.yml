name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Prepare web files
        run: |
          mkdir -p www
          echo "الملفات الموجودة في الجذر:"; ls -la
          if [ ! -f index.html ]; then
            F=$(ls *.html 2>/dev/null | head -n1)
            [ -n "$F" ] && cp "$F" www/index.html || { echo "لا يوجد ملف html في جذر المستودع"; exit 1; }
          else
            cp index.html www/
          fi
          for f in manifest.json sw.js icon-192.png icon-512.png; do
            [ -f "$f" ] && cp "$f" www/ || echo "تخطي $f (غير موجود)"
          done
      - name: Capacitor project
        run: |
          npm init -y
          npm i --no-audit --no-fund @capacitor/core @capacitor/cli @capacitor/android @capacitor/local-notifications
          npx cap init "منصة دعوة" com.dawa.platform --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Adhan sound + permissions
        run: |
          RAW=android/app/src/main/res/raw
          mkdir -p $RAW
          if [ -f adhan.mp3 ]; then
            cp adhan.mp3 $RAW/adhan.mp3
          else
            echo "adhan.mp3 غير موجود: محاولة تحميل أذان افتراضي"
            curl -fsSL --retry 3 -o $RAW/adhan.mp3 https://cdn.aladhan.com/audio/adhans/a9.mp3 || { rm -f $RAW/adhan.mp3; echo "تعذر التحميل: سيعمل الإشعار بصوت النظام الافتراضي"; }
          fi
          M=android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM USE_EXACT_ALARM RECEIVE_BOOT_COMPLETED WAKE_LOCK VIBRATE; do
            grep -q "android.permission.$P" $M || sed -i "s#<application#<uses-permission android:name=\"android.permission.$P\" />\n    <application#" $M
          done
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dawa-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
